        <h1>Binair stelsel</h1>
        <p>Een computer rekent met maar twee cijfers: 0 en 1. Elke plek in het getal heeft een eigen waarde.</p>

          <tr>
            <th>128</th>

            <td>1</td>

            <td>1</td>
          </tr>
        </table>

        <p>8 + 4 + 1 = 13, dus 00001101 is het getal 13.</p>
